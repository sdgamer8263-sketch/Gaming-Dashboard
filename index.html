<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SKA HOSTING | Official Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@900&family=Rajdhani:wght@500;700&display=swap');
        
        body { 
            background: url('ccccccccccccccccccc.gif') no-repeat center center fixed; 
            background-size: cover; background-color: #000; color: white; font-family: 'Rajdhani', sans-serif; 
        }
        .glass-ui { background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(15px); border: 1px solid rgba(59, 130, 246, 0.2); }
        .spec-card { background: rgba(15, 23, 42, 0.9); border: 2px solid rgba(59, 130, 246, 0.3); transition: 0.3s; }
        .spec-card:hover { border-color: #3b82f6; box-shadow: 0 0 20px rgba(59, 130, 246, 0.5); transform: translateY(-5px); }
        .glow-text { color: #3b82f6; text-shadow: 0 0 10px rgba(59, 130, 246, 0.8); }
        .hidden { display: none; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <div id="auth-screen" class="fixed inset-0 z-[100] flex items-center justify-center bg-black/95 p-4">
        <div class="glass-ui p-8 rounded-[2rem] max-w-md w-full text-center">
            <img src="jkjkkjkjkjkjkjkjjk.png" class="w-20 mx-auto mb-4">
            <h2 id="auth-status" class="text-2xl font-black mb-6 font-['Orbitron'] glow-text">SYSTEM ACCESS</h2>
            <div class="space-y-4">
                <input type="email" id="email" placeholder="Email" class="w-full p-3 rounded-xl bg-gray-800 border border-blue-500/30 outline-none text-white">
                <input type="password" id="pass" placeholder="Password" class="w-full p-3 rounded-xl bg-gray-800 border border-blue-500/30 outline-none text-white">
                <div class="flex gap-2">
                    <button onclick="login()" class="flex-1 bg-blue-600 py-3 rounded-xl font-bold hover:bg-blue-500 transition">LOGIN</button>
                    <button onclick="register()" class="flex-1 bg-gray-700 py-3 rounded-xl font-bold hover:bg-gray-600 transition">REGISTER</button>
                </div>
            </div>
            <p id="msg" class="text-xs mt-4 text-red-400"></p>
        </div>
    </div>

    <div id="dashboard" class="flex flex-col md:flex-row flex-1 hidden">
        <aside class="w-full md:w-72 p-6 glass-ui border-r border-blue-500/20">
            <div class="flex items-center gap-4 mb-10">
                <img src="jkjkkjkjkjkjkjkjjk.png" class="w-10 h-10">
                <h1 class="text-xl font-black font-['Orbitron'] glow-text">SKA HOSTING</h1>
            </div>
            <nav class="space-y-4">
                <button class="w-full text-left p-4 rounded-xl bg-blue-600/20 border-l-4 border-blue-500 font-bold">🏠 DASHBOARD</button>
                <a href="https://discord.gg/UqfbtuURca" target="_blank" class="block w-full text-left p-4 rounded-xl hover:bg-gray-800 transition font-bold">💬 DISCORD</a>
                <button onclick="logout()" class="w-full text-left p-4 rounded-xl hover:bg-red-900/20 text-red-500 font-bold">🚪 LOGOUT</button>
            </nav>
        </aside>

        <main class="flex-1 p-6 md:p-12">
            <h2 id="typing" class="text-3xl md:text-5xl font-black text-green-400 font-['Orbitron'] min-h-[60px] mb-12"></h2>

            <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 mb-12">
                <div class="spec-card p-8 rounded-[2.5rem]">
                    <h3 class="text-2xl font-black mb-2 italic">FREE MINECRAFT</h3>
                    <p class="text-gray-400 mb-8">Deploy on community nodes. (Admin Approval Required)</p>
                    <a href="https://dash.sgaming9107.qzz.io/" class="block text-center py-4 bg-blue-600 rounded-2xl font-black hover:bg-blue-500 transition">ACCESS PANEL</a>
                </div>

                <div class="spec-card p-8 rounded-[2.5rem] border-purple-500/50 bg-gradient-to-br from-purple-900/20 to-transparent">
                    <h3 class="text-2xl font-black mb-2 text-purple-400 italic">PREMIUM NODE 💎</h3>
                    <div class="bg-black/60 p-4 rounded-xl mb-6 border border-yellow-500/20">
                        <p class="text-[10px] text-yellow-500 font-bold mb-1 uppercase tracking-widest">Payment UPI (GPay/Paytm/PhonePe)</p>
                        <p class="text-lg font-bold text-white tracking-widest">manasde648@okhdfcbank</p>
                    </div>
                    <a href="https://skapanel.skahosting.qzz.io/" class="block text-center py-4 bg-purple-600 rounded-2xl font-black hover:bg-purple-500 transition">BUY NOW</a>
                </div>
            </div>
        </main>
    </div>

    <footer class="w-full bg-black/95 border-t-2 border-blue-500/50 p-8">
        <div class="max-w-7xl mx-auto grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
            <div class="spec-card p-6 rounded-3xl text-center">
                <p class="text-blue-500 font-black text-xs uppercase mb-2">Processor</p>
                <p class="text-2xl font-black font-['Orbitron'] glow-blue">EPYC™ 7742</p>
            </div>
            <div class="spec-card p-6 rounded-3xl text-center">
                <p class="text-blue-500 font-black text-xs uppercase mb-2">Memory</p>
                <p class="text-2xl font-black font-['Orbitron'] glow-blue">256GB RAM</p>
            </div>
            <div class="spec-card p-6 rounded-3xl text-center">
                <p class="text-blue-500 font-black text-xs uppercase mb-2">Storage</p>
                <p class="text-2xl font-black font-['Orbitron'] glow-blue">NVME GEN4</p>
            </div>
            <div class="spec-card p-6 rounded-3xl text-center">
                <p class="text-blue-500 font-black text-xs uppercase mb-2">Network</p>
                <p class="text-2xl font-black font-['Orbitron'] glow-blue">10GBPS</p>
            </div>
        </div>
    </footer>

    <script>
        // FIREBASE CONFIG
        const firebaseConfig = {
            apiKey: "AIzaSyAGVfIAcVsMh6YcXSqmu_PIkGgjCtwGNYc",
            authDomain: "ska-hosting-buddy-ai.firebaseapp.com",
            projectId: "ska-hosting-buddy-ai",
            storageBucket: "ska-hosting-buddy-ai.firebasestorage.app",
            messagingSenderId: "122658609461",
            appId: "1:122658609461:web:746da8ac58d37c12fed47c"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        // AUTH FUNCTIONS
        function login() {
            const e = document.getElementById('email').value;
            const p = document.getElementById('pass').value;
            auth.signInWithEmailAndPassword(e, p)
                .then(() => showDashboard())
                .catch(err => document.getElementById('msg').innerText = err.message);
        }

        function register() {
            const e = document.getElementById('email').value;
            const p = document.getElementById('pass').value;
            auth.createUserWithEmailAndPassword(e, p)
                .then(() => showDashboard())
                .catch(err => document.getElementById('msg').innerText = err.message);
        }

        function logout() {
            auth.signOut().then(() => location.reload());
        }

        function showDashboard() {
            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('dashboard').classList.remove('hidden');
            startTyping();
        }

        // Check if user is already logged in
        auth.onAuthStateChanged(user => {
            if (user) showDashboard();
        });

        // Typing Effect
        const msg = "Welcome to SKA HOSTING - Next Gen Gaming Nodes.";
        let i = 0;
        function startTyping() {
            if (i < msg.length) {
                document.getElementById("typing").innerHTML += msg.charAt(i);
                i++;
                setTimeout(startTyping, 100);
            }
        }
    </script>
</body>
</html>
